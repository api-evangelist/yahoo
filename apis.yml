  - aid: yahoo:dsp-reporting-api
    name: Yahoo DSP Reporting API
    description: >-
      Asynchronous large-scale reporting API for Yahoo DSP campaign data. A Reporting object -
      composed of reportOption, limitSpec, filterOption, having and spec sub-objects plus account
      IDs, date type, interval type and currency - is POSTed to create a report, then polled by
      customerReportId until a CSV download URL is returned, valid for 24 hours. Reports may be up
      to 20 GB, are capped at 500,000 rows per seat per day, and can reach back 13 months. The API
      publishes an enumerated E-prefixed error-code table.
    humanURL: https://help.yahooinc.com/dsp-api/docs/reporting-api
    baseURL: http://api-sched-v3.admanagerplus.yahoo.com/yamplus_api/extreport/
    tags:
      - Advertising
