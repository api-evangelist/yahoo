    x-note: >-
      Yahoo documents this endpoint over plain http, not https, in its own Resources article.
      Recorded verbatim rather than silently upgraded.
  - aid: yahoo:conversion-api
    name: Yahoo Conversion API
    description: >-
      Server-to-server conversion-event API (CAPI) for campaign measurement, attribution and
      optimization, positioned as the successor to browser-side Dot Pixel tracking. Two
      specifications are published - a Standard variant using the conversion structures already
      present in the Yahoo DSP and Dot Pixel, and a Product variant supporting product-level
      events for the Yahoo In-Flight Outcomes solution. Requires its own direct OAuth 2.0 setup
      separate from the DSP Traffic API. Third-party integrations exist through LiveRamp,
      Narrative and Hightouch.
    humanURL: https://help.yahooinc.com/dsp-api/docs/yahoo-conversion-api
    baseURL: https://batch.datax.yahoo.com/v1/events/
    tags:
      - Advertising
      - Conversion Tracking
