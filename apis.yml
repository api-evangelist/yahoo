  - aid: yahoo:datax-api
    name: Yahoo Ad Tech DataX API
    description: >-
      Partner-facing data-exchange API for uploading and managing audience taxonomies, user and
      audience membership, fees and measurement feeds, plus a Real-Time API (specification v2.0),
      a Partner Match data-in API and exposure-log delivery to Amazon S3, Microsoft Azure and
      Google Cloud. Onboarding is a manual RSA key exchange with Yahoo data operations. It is the
      only Yahoo API surface with hypermedia affordances, returning typed link relations under
      datax.yahooapis.com/rels/ and opaque resource links. GDPR handling - jurisdiction flags,
      IAB TCF consent purpose bits and opt-out semantics - is documented in depth.
    humanURL: https://help.yahooinc.com/datax/docs/yahoo-ad-tech-datax-api-specifications
    baseURL: https://datax.yahooapis.com/v1
    tags:
      - Advertising
      - Audience Data
      - Data Exchange
      - Taxonomy
      - GDPR
