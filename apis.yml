apis:
  - aid: yahoo:yahoo
    name: Yahoo Fantasy Sports API
    description: >-
      The Fantasy Sports APIs provide URIs used to access fantasy sports data, supporting
      retrieval of Fantasy Football, Baseball, Basketball and Hockey data including game, league,
      team, player, roster and transaction information. The APIs follow a composed-URI model in
      which resources like game, league, team and player and collections like games, leagues,
      teams and players are stacked as path segments and filtered with semicolon matrix
      parameters, so a single request can return a player nested inside its league. Responses are
      XML by default with JSON available via format=json. Access requires a registered Yahoo app
      and a three-legged OAuth 2.0 authorization-code grant.
    humanURL: https://sports.yahoo.com/developer
    baseURL: https://fantasysports.yahooapis.com/fantasy/v2
    tags:
      - Fantasy Sports
      - Sports Data
      - Consumer
    properties:
      - type: Documentation
        url: https://sports.yahoo.com/developer
      - type: APIReference
        url: https://sports.yahoo.com/developer/docs/
      - type: GettingStarted
        url: https://developer.yahoo.com/oauth2/guide/flows_authcode/
      - type: SignUp
        url: https://developer.yahoo.com/apps/create/
      - type: Authentication
        url: authentication/yahoo-authentication.yml
      - type: DataModel
        url: data-model/yahoo-data-model.yml
  - aid: yahoo:dsp-traffic-api
    name: Yahoo DSP Traffic API
    description: >-
      RESTful campaign-management API for the Yahoo demand-side platform. Exposes the full
      trafficking hierarchy - seats, account groups, advertisers, campaigns, packages, lines, ads
      and creatives - plus audiences of nine types, contextuals, supply lists, deals, exchanges,
      pixels, bid multipliers, targeting and audit logs. Authentication is a two-legged OAuth 2.0
      client-credentials flow whose token is presented in Yahoo's own X-Auth-Token header rather
      than Authorization. Campaigns cannot be deleted through the API; state is managed by status
      transition. A live GET /traffic/ratelimit endpoint returns the caller's own quota and
      remaining balance.
    humanURL: https://help.yahooinc.com/dsp-api/docs/yahoo-dsp-traffic-api
    baseURL: https://dspapi.admanagerplus.yahoo.com/traffic/
    tags:
      - Advertising
      - Programmatic Advertising
      - Demand-Side Platform
      - Campaign Management
    tags_raw:
      - Advertising
