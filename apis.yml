aid: yahoo
name: Yahoo
description: >-
  Yahoo is a consumer internet and advertising-technology company operating Yahoo Mail, Yahoo
  Finance, Yahoo Sports and Yahoo Search alongside one of the largest independent demand-side
  platforms in programmatic advertising. Its public API surface splits cleanly in two. On the
  consumer side, the Yahoo Fantasy Sports API exposes fantasy football, baseball, basketball and
  hockey game, league, team, player, roster and transaction data over a composed URI tree at
  fantasysports.yahooapis.com, secured by a three-legged OAuth 2.0 flow against the Yahoo identity
  service, which itself publishes a full OpenID Connect discovery document. On the enterprise
  side, Yahoo Ad Tech ships the DSP Traffic API for programmatic campaign management, the DSP
  Reporting API for large-scale campaign measurement, the server-to-server Yahoo Conversion API,
  and the DataX API for audience and taxonomy exchange with data partners - all gated behind an
  existing DSP seat or a partner onboarding agreement and authenticated with a two-legged
  client-credentials JWT flow. Yahoo publishes no OpenAPI for any of these surfaces, distributing
  a public Postman collection and an llms.txt documentation index instead.
