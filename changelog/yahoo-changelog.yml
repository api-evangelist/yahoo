specification: API Commons ChangeLog
specificationVersion: '0.1'
provider: Yahoo
providerId: yahoo
generated: '2026-08-28'
method: searched
source: >-
  https://help.yahooinc.com/dsp-api/docs/traffic-api-release-notes ,
  https://help.yahooinc.com/dsp-api/docs/reporting-api-release-notes
docs:
  - https://help.yahooinc.com/dsp-api/docs/traffic-api-release-notes
  - https://help.yahooinc.com/dsp-api/docs/reporting-api-release-notes
  - https://help.yahooinc.com/dsp-api/docs/conversion-api-release-notes
