specification: API Commons MCP
specificationVersion: '0.1'
provider: Yahoo
providerId: yahoo
generated: '2026-08-28'
method: searched
source: >-
  https://help.yahooinc.com/dsp-api/docs/yahoo-dsp-and-agentic-ai ,
  https://help.yahooinc.com/llms.txt , registry.npmjs.org , pypi.org
status: announced-not-shipped
description: >-
  Yahoo has publicly stated an intent to ship MCP servers for the DSP and has shipped nothing yet.
  The DSP documentation set carries a page, "Yahoo DSP and Agentic AI" (published 2025-08-25),
  saying developers "will have direct access to Model Context Protocol (MCP) servers, enabling
  efficient agentic operations across planning, activation, reporting and custom workflow
  integrations" - future tense, with a Google Form soliciting input and an email address for
  partnership. No endpoint URL, no package, no installation instruction and no tool list is
  published anywhere on the Yahoo surface, and no Yahoo-published MCP package exists on npm or
  PyPI. This artifact records the announcement and the absence; it does not derive a candidate
  tool list, because Yahoo publishes no OpenAPI to ground one in.
deployment:
  mode: none
  endpoint: null
  install: null
  package: null
  auth: unknown
  verified: searched
