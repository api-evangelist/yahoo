note: >-
  No MCPServer pointer is emitted in apis.yml. Emitting one would assert that an agent can reach
  Yahoo through MCP today, which is not true. What Yahoo DOES publish for agents is an llms.txt
  documentation index at help.yahooinc.com/llms.txt covering 192 pages across the DSP API, DataX
  API, ConnectID and Identity documentation sets - saved to llms/yahoo-llms.txt and pointed at
  with type LLMsTxt. Re-probe this artifact when the DSP MCP servers ship.
